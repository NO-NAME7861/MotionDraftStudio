name: Explainer Series (Daily)

on:
  schedule:
    # Daily 00:30 UTC — free-quota window, generate the next Re:Zero explainer
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      episode_id:
        description: "Re:Zero episode ID (R001-R006)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  explainer:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-indic fontconfig
          sudo fc-cache -f

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Decode YouTube token
        run: |
          echo "${{ secrets.YOUTUBE_TOKEN_JSON }}" | base64 -d > token.json
          test -s token.json && echo "token.json OK"

      - name: Determine next episode to build
        id: next_ep
        run: |
          if [ -n "${{ inputs.episode_id }}" ]; then
            echo "id=${{ inputs.episode_id }}" >> $GITHUB_OUTPUT
          else
            # Read state
            python -c "
            import json, pathlib
            p = pathlib.Path('state/episodes_rezero.json')
            s = json.loads(p.read_text()) if p.exists() else {'next_id': 'R001', 'done': []}
            print(s['next_id'])
            " > next_id.txt
            echo "id=$(cat next_id.txt)" >> $GITHUB_OUTPUT
          fi

      - name: Build and upload Re:Zero explainer
        env:
          TTS_VOICE: "ur-PK-UzmaNeural"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: "nvidia/nemotron-3-ultra-550b-a55b:free"
          EPISODES_CSV: episodes_rezero.csv
          EPISODE_ID: ${{ steps.next_ep.outputs.id }}
          EXPLAINER_PARTS: 6
          WORDS_PER_PART: 4500
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python build_explainer.py

      - name: Save Re:Zero state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p state
          python -c "
          import json, os
          ep = '${{ steps.next_ep.outputs.id }}'
          p = 'state/episodes_rezero.json'
          s = json.loads(open(p, encoding='utf-8').read()) if os.path.exists(p) else {'next_id': 'R001', 'done': []}
          if ep not in s['done']:
              s['done'].append(ep)
          ids = ['R001','R002','R003','R004','R005','R006']
          try:
              s['next_id'] = ids[ids.index(ep) + 1]
          except IndexError:
              s['next_id'] = 'R006'  # last
          open(p, 'w', encoding='utf-8').write(json.dumps(s, indent=2))
          print('state ->', s)
          "
          git add state/episodes_rezero.json
          git diff --cached --quiet || (git commit -m "chore: advance rezero state" && git pull --rebase origin main && git push origin HEAD:main)

      - name: Upload work artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explainer-work
          path: |
            explainer-work/*.json
            explainer-work/*.txt
            explainer-work/*.srt
          retention-days: 14
