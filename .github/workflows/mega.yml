name: Mega 2H Hindi Recap

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Story variant: M001 = betrayal thriller (CN), M002 = ronin samurai (JP), M003 = earthen god 20yr revenge (CN)"
        required: true
        default: M001
        type: choice
        options: ["M001", "M002", "M003"]
      skip_llm:
        description: "Skip LLM stage, use salvaged mega-salvage/narration.txt (zero LLM calls)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  mega:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Decode YouTube token
        run: |
          echo "${{ secrets.YOUTUBE_TOKEN_JSON }}" | base64 -d > token.json
          test -s token.json && echo "token.json OK"

      - name: Build and upload mega episode (2h+)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: "nvidia/nemotron-3-ultra-550b-a55b:free"  # repo var gemma-4-31b-it:free is persistently 429; ultra actually answers
          # (intentionally NOT using vars.OPENROUTER_MODEL here - it forces the 429ing model)
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MEGA_VARIANT: ${{ inputs.variant || 'M001' }}
          MEGA_SKIP_LLM: ${{ inputs.skip_llm && '1' || '0' }}
        run: python make_mega_video.py

      - name: Upload work artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mega-work
          path: |
            mega-work/*.json
            mega-work/*.txt
            mega-work/*.srt
          retention-days: 14
