name: Daily Episode Upload

on:
  schedule:
    # 6 episodes per day, spread every 4 hours (UTC) = 00:00/04:00/08:00/12:00/16:00/20:00 UTC
    # (PKT: 5 AM / 9 AM / 1 PM / 5 PM / 9 PM / 1 AM)
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      privacy:
        description: "Upload privacy"
        required: true
        default: "public"
        type: choice
        options: ["private", "public", "unlisted"]
      episode_index:
        description: "Force a specific episode ID (e.g. A002)"
        required: false
        default: ""
        type: string
      episodes_csv:
        description: "Episode CSV file to use"
        required: false
        default: ""
        type: string
      style:
        description: "Recap style: chinese or japanese"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-indic fonts-noto-core fonts-noto-extra fonts-freefont-ttf fontconfig
          sudo fc-cache -f

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Decode YouTube token
        run: |
          echo "${{ secrets.YOUTUBE_TOKEN_JSON }}" | base64 -d > token.json
          test -s token.json && echo "token.json OK"

      - name: Generate episode and upload
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: "nvidia/nemotron-3-ultra-550b-a55b:free"  # repo var forces 429-dead gemma; ultra actually answers
          TTS_VOICE: 'hi-IN-SwaraNeural'  # Hindi-Urdu-English mixed narration
          PRIVACY_STATUS: ${{ inputs.privacy || vars.PRIVACY_STATUS || 'public' }}
          EPISODES_CSV: ${{ inputs.episodes_csv || vars.EPISODES_CSV || 'episodes_100.csv' }}
          STYLE: ${{ inputs.style || vars.STYLE || 'japanese' }}
          EPISODE_INDEX: ${{ inputs.episode_index || '' }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          UPLOAD: "1"
        run: python generate_episode.py

      - name: Check subscriber milestones (tribute video at 50/100/500/1K/every-5K)
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python check_milestones.py

      - name: Save progress state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/episodes.json state/milestones.json
          git diff --cached --quiet || (git commit -m "chore: advance episode state" && git pull --rebase origin main && git push origin HEAD:main)

      - name: Upload work artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-work
          path: |
            work/*.json
            work/*.txt
            work/*.srt
          retention-days: 14

