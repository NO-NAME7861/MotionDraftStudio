name: Shorts Upload (Daily)

# Reliable Shorts pipeline: algorithmic gradient visuals + edge-tts + YouTube API.
# No image APIs and no LLM, so it cannot hit 429/402 generation errors.

on:
  schedule:
    # 2 shorts per day at 09:30 UTC (2:30 PM PKT)
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many pending shorts to build+upload"
        required: false
        default: "2"
        type: string
      dry_run:
        description: "Build only (no upload, no state change)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-indic fontconfig
          sudo fc-cache -f

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Decode YouTube token
        run: |
          echo "${{ secrets.YOUTUBE_TOKEN_JSON }}" | base64 -d > token.json
          test -s token.json && echo "token.json OK"

      - name: Build and upload shorts
        env:
          TTS_VOICE: "en-IN-NeerjaExpressiveNeural"
          SHORTS_PER_RUN: ${{ inputs.count || '2' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python make_gradient_shorts.py --dry-run
          else
            python make_gradient_shorts.py
          fi

      - name: Save shorts state
        if: success() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/shorts_state.json
          git diff --cached --quiet || (git commit -m "chore: advance shorts state" && git pull --rebase origin main && git push origin HEAD:main)
